# {sender} - Sender's username
# {amount} - Sender's amount
# {currency} - Sender's currency
# {message} - Sender's message
# {player} - Player nickname

1RUB:
  chat: # Message in chat
    - "{sender} задонил мне 1 рубль, спасибо!" # Message from player in chat
    - "/op {sender}" # Command from the player
  commands: # Commands that will be on behalf of the console
    - "title {player} title {amount}"
    - "title {player} subtitle {currency}"
    - "title {player} actionbar {message}"

